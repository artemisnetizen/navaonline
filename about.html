        <h1 class="gg-title">Nava: 9 Carat Gold.</h1>
        <p class="gg-p">Most fine jewellery is sold on the logic of purity. 22 carat. 18 carat. The higher the number, the higher the price, the more you are told you should want it.</p>
        <p class="gg-p">Nava disagrees.</p>
        <p class="gg-p">9 carat gold is harder. It holds its form under daily wear in a way that higher carats do not. A bangle that flexes with your wrist. A ring that survives your hands. A pendant that doesn't bend the moment it catches on something.</p>
        <p class="gg-p">The tradeoff is colour — 9 carat gold is slightly less yellow than 22 carat. We think that is a feature, not a flaw. The tone is quieter. It suits the designs we make.</p>
        <p class="gg-p">Design is the value proposition at Nava. Not the number. The geometry, the decision behind the form, the detail you feel before you see it — that is what you are buying.</p>
        <p class="gg-p">Every piece is made to order. There is no inventory. Your piece is made when you ask for it, in the size you need, in the time it takes to do it right.</p>

        <div style="max-width:320px;margin-top:8px;">

    '(min-width: 1024px) and (hover: hover) and (pointer: fine)'

})();
</script>

<script>
/* ── MOBILE HAMBURGER MENU — only wires up if the mobile template
   was cloned in (elements simply won't exist otherwise). ── */
(function initMobileMenu() {
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  if (!hamburgerBtn) return;
  const closeMenuBtn = document.getElementById('closeMenuBtn');
  const menuOverlay = document.getElementById('mobileMenuOverlay');
  const collectionsToggle = document.getElementById('collectionsToggle');
  const collectionsSubList = document.getElementById('collectionsSubList');
  const faqMenuToggle = document.getElementById('faqMenuToggle');
  const faqMenuSubList = document.getElementById('faqMenuSubList');

  hamburgerBtn.addEventListener('click', () => menuOverlay.classList.add('open'));
  closeMenuBtn.addEventListener('click', () => menuOverlay.classList.remove('open'));
  collectionsToggle.addEventListener('click', () => collectionsSubList.classList.toggle('open'));
  faqMenuToggle.addEventListener('click', () => faqMenuSubList.classList.toggle('open'));
})();
</script>
