function slugify(str) {

function formatPriceINR(n) {

/* Builds the Material/Weight (or Material/Gold Weight/Silver Weight)
   provenance fields for a variant. sizeKey selects a sized record's
   per-size weight from v.sizeVariantGids; pass null/undefined for
   non-sized variants, which read v.raw*WeightG instead. Called both from
   mergePricingData() (initial render) and the size-chip click handler
   (live update on size change), so Weight always reflects the metal
   actually in the selected size rather than the top-level (sizeless)
   weight_g. */
function buildMetalProvenance(v, sizeKey) {
  const source = sizeKey ? v.sizeVariantGids?.[sizeKey] : v;
  const weight = source ? (sizeKey ? source.weight_g : v.rawWeightG) : null;
  const goldWeight = source ? (sizeKey ? source.gold_weight_g : v.rawGoldWeightG) : null;
  const silverWeight = source ? (sizeKey ? source.silver_weight_g : v.rawSilverWeightG) : null;
  const fmt = (n) => (n != null ? `${n} grams` : '—');

  const provenance = {};
  if (v.metal === 'gold_9k_silver') {
    provenance['Material'] = '9 kt gold, silver';
    provenance['Gold Weight'] = fmt(goldWeight);
    provenance['Silver Weight'] = fmt(silverWeight);
  } else {
    provenance['Material'] = '9 kt gold';
    provenance['Weight'] = fmt(weight);
  }
  return provenance;
}

/* Computes the gold/silver/making-charge/GST breakdown behind a variant's
   displayed price, for a given size (or the non-sized variant when sizeKey
   is null/undefined). Returns null if pricing-data.json hasn't loaded yet;
   otherwise returns rows with any not-yet-known value left as null so the
   render step can show "—" instead of a misleading 0. This is the single
   source of truth for the formula — both the popover and the main price
   display call this. */
function computePriceForSize(v, sizeKey) {
  const goldRate = TODAY_GOLD_RATE_PER_G;
  const silverRate = TODAY_SILVER_RATE_PER_G;
  const rows = [];
  let metalTotal = 0;

  const sizeData = sizeKey ? v.sizeVariantGids?.[sizeKey] : null;
  const weightSource = sizeData || v;  // sizeData's own weight_g/gold_weight_g/silver_weight_g, or the non-sized v.raw* fields

  const weightG = sizeData ? weightSource.weight_g : v.rawWeightG;
  const goldWeightG = sizeData ? weightSource.gold_weight_g : v.rawGoldWeightG;
  const silverWeightG = sizeData ? weightSource.silver_weight_g : v.rawSilverWeightG;

  if (v.metal === 'gold_9k_silver') {
    const goldCost = (goldRate != null && goldWeightG != null) ? Math.round(goldWeightG * goldRate) : null;
    const silverCost = (silverRate != null && silverWeightG != null) ? Math.round(silverWeightG * silverRate) : null;
    rows.push({ label: 'Gold', weight: goldWeightG, rate: goldRate, cost: goldCost });
    rows.push({ label: 'Silver', weight: silverWeightG, rate: silverRate, cost: silverCost });
    if (goldCost != null && silverCost != null) metalTotal = goldCost + silverCost;
    else metalTotal = null;
  } else {
    const goldCost = (goldRate != null && weightG != null) ? Math.round(weightG * goldRate) : null;
    rows.push({ label: 'Gold', weight: weightG, rate: goldRate, cost: goldCost });
    metalTotal = goldCost;
  }

  const makingCharge = typeof v.rawMakingCharge === 'number' ? Math.round(v.rawMakingCharge) : v.rawMakingCharge;
  const canCalculateTotal = metalTotal != null && typeof makingCharge === 'number';
  const gst = canCalculateTotal ? Math.round(0.03 * (metalTotal + makingCharge)) : null;
  const total = canCalculateTotal ? metalTotal + makingCharge + gst : null;

  return { rows, metalTotal, makingCharge, gst, total };
}

/* Resolves the variant actually being purchased: a sized variant's own
   selected-size GID if a real one has been created, else the parent's
   (legacy, non-sized) GID as fallback — real per-size Shopify variants
   don't exist for ekai_ring yet, so this currently always falls back. */
function resolveVariantGid(v) {
  if (v.sizeVariantGids) {
    const selectedSize = document.querySelector('.szchip.sel')?.dataset.s;
    const sizeRecord = selectedSize ? v.sizeVariantGids[selectedSize] : null;
    if (sizeRecord && sizeRecord.shopify_variant_gid) {

    }
  }
  return v.shopifyVariantId;
}

  if (!totalSlides) return;

  track.style.transform = `translateX(-${current * (100 / totalSlides)}%)`;
  if (animate === false) requestAnimationFrame(() => track.classList.remove('no-transition'));

    slide.style.width = `${100 / totalSlides}%`;
    const img = document.createElement('img');
    img.src = `${v.imageFolder}/${src}`;
    img.alt = `${design.name} ${v.label}`;
    slide.appendChild(img);
    track.appendChild(slide);
  });
  v.images.forEach((src, i) => {
    const th = document.createElement('div');
    th.className = i === 0 ? 'hthumb on' : 'hthumb';
    const tImg = document.createElement('img');
    tImg.src = `${v.imageFolder}/${src}`;
    tImg.alt = '';
    th.appendChild(tImg);
    th.addEventListener('click', () => setSlide(i));
    thumbsEl.appendChild(th);
  });
  setSlide(0, false);

  heroTagEl.textContent = v.collection;

  if (heroWhatsappEl) {
    const waMessage = encodeURIComponent(`Hi, I'm interested in the ${design.name} ${v.label}`);
    heroWhatsappEl.href = `https://wa.me/917356774555?text=${waMessage}`;
  }

  // Story
  panelDesign.textContent = v.story;

  // Provenance
  panelProv.innerHTML = '';
  Object.entries(v.provenance).forEach(([k, val]) => {
    const row = document.createElement('div');
    row.className = 'prow';
    row.innerHTML = `<span class="pk">${k}</span><span class="pv">${val}</span>`;
    panelProv.appendChild(row);
  });

  // Price
  priceEl.textContent = v.price;

  const showSkinTones = v.showSkinTones !== false;
  const showSizes = v.showSizes !== false && Array.isArray(v.sizes) && v.sizes.length > 0;

  skinExpRow.style.display = showSkinTones ? '' : 'none';

  sizeRowEl.innerHTML = '';
  if (showSizes) {
    sizeExpRow.style.display = '';
    v.sizes.forEach((s, i) => {
      const btn = document.createElement('button');
      const isCustom = s === 'Custom';
      btn.className = isCustom ? 'szchip disabled' : (s === v.selectedSize ? 'szchip sel' : 'szchip');
      if (isCustom) btn.disabled = true;
      btn.dataset.s = s;
      btn.textContent = s;
      if (!isCustom) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.szchip').forEach(x => x.classList.remove('sel'));
          this.classList.add('sel');
          v.selectedSize = s;
          const breakdown = computePriceForSize(v, s);
          if (breakdown && breakdown.total != null) {
            v.price = formatPriceINR(breakdown.total);
            priceEl.textContent = v.price;
          }

          Object.assign(v.provenance, buildMetalProvenance(v, s));
          panelProv.querySelectorAll('.prow').forEach(row => {
            const keyEl = row.querySelector('.pk');
            const valEl = row.querySelector('.pv');
            if (keyEl && valEl && Object.prototype.hasOwnProperty.call(v.provenance, keyEl.textContent)) {
              valEl.textContent = v.provenance[keyEl.textContent];
            }
          });
        });
      }
      sizeRowEl.appendChild(btn);
    });
  } else {
    sizeExpRow.style.display = 'none';
  }

  expandersWrap.style.display = (showSkinTones || showSizes) ? '' : 'none';

  // Reset quantity
  currentQty = 1;
  qtyValueEl.textContent = currentQty;
}

/* ── VARIANT BOXES ── */
const variantBoxesEl = document.getElementById('variantBoxes');
Object.entries(variants).forEach(([key, v]) => {
  const box = document.createElement('div');
  box.className = key === activeKey ? 'variant-box active' : 'variant-box';
  box.textContent = v.label;
  box.dataset.key = key;
  box.tabIndex = 0;
  box.setAttribute('role', 'button');
  box.setAttribute('aria-pressed', key === activeKey ? 'true' : 'false');
  const activate = () => {
    if (key === activeKey) return;
    renderVariant(key);
    document.querySelectorAll('.variant-box').forEach(b => {
      const on = b.dataset.key === key;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  };
  box.addEventListener('click', activate);
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
  });
  variantBoxesEl.appendChild(box);
});

/* ── NAV SCROLL ── */
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 10);
}, { passive: true });

/* ── DRAG / SWIPE ── */
const heroEl = document.getElementById('hero');
function dragStart(x) { startX = x; dragDx = 0; isDragging = true; }
function dragMove(x)  { if (isDragging) dragDx = x - startX; }
function dragEnd()    {
  if (!isDragging) return; isDragging = false;
  if      (dragDx < -44) setSlide(current + 1);
  else if (dragDx >  44) setSlide(current - 1);
}
heroEl.addEventListener('touchstart', e => dragStart(e.touches[0].clientX),    { passive: true });
heroEl.addEventListener('touchmove',  e => dragMove(e.touches[0].clientX),     { passive: true });
heroEl.addEventListener('touchend',   dragEnd,                                  { passive: true });
heroEl.addEventListener('mousedown',  e => dragStart(e.clientX));
heroEl.addEventListener('mousemove',  e => dragMove(e.clientX));
heroEl.addEventListener('mouseup',    dragEnd);
heroEl.addEventListener('mouseleave', dragEnd);

/* ── EXHIBIT NAV ── Vaan occupies exactly one slot regardless of
   which variant box is active; Next/Prev skip straight to the next
   design (Imai), never into the earring/ring/pendant sub-states. ── */
const PIECES = [
  { file: 'suri.html' },
  { file: 'niva.html' },
  { file: 'vara.html' },
  { file: 'rani.html' },
  { file: 'abha.html' },
  { file: 'sama.html' }
];
function buildExhibitNav() {
  const nav = document.getElementById('exhibitNav');
  const prevChevron = `<svg viewBox="0 0 10 10" fill="none" width="10" height="10"><path d="M7 2L3 5L7 8" stroke="rgba(240,237,228,0.7)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const nextChevron = `<svg viewBox="0 0 10 10" fill="none" width="10" height="10"><path d="M3 2L7 5L3 8" stroke="rgba(240,237,228,0.7)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  const prevSide = document.createElement('a');
  prevSide.className = 'exhibit-nav-side prev';
  if (design.prevPiece) {
    prevSide.href = design.prevPiece.file;
    prevSide.innerHTML = `<div class="exhibit-nav-label-row">${prevChevron}<span class="exhibit-nav-name">${design.prevPiece.name}</span></div><span class="exhibit-nav-count">${PIECE_INDEX - 1} / ${PIECES.length}</span>`;
  } else {
    prevSide.href = 'index.html';
    prevSide.innerHTML = `<div class="exhibit-nav-label-row">${prevChevron}<span class="exhibit-nav-name">Origami</span></div><span class="exhibit-nav-count">Back to collection</span>`;
  }
  nav.appendChild(prevSide);

  const centerWrap = document.createElement('div');
  centerWrap.className = 'exhibit-nav-center';

  const addBtn = document.createElement('button');
  addBtn.className = 'exhibit-nav-add';
  addBtn.type = 'button';
  addBtn.setAttribute('aria-label', 'Quick add to cart');
  addBtn.innerHTML = `<svg viewBox="0 0 16 16" fill="none" width="15" height="15"><path d="M8 14C8 14 1.5 9.8 1.5 5.2C1.5 2.9 3.3 1.5 5.2 1.5C6.5 1.5 8 2.3 8 3.9C8 2.3 9.5 1.5 10.8 1.5C12.7 1.5 14.5 2.9 14.5 5.2C14.5 9.8 8 14 8 14Z" stroke="#797842" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="exhibit-nav-tooltip">I like it</span>`;
  addBtn.addEventListener('click', async () => {
    addBtn.disabled = true;
    const v = variants[activeKey];
    try {
      await addToCart(resolveVariantGid(v), 1);
      flyToCart(addBtn, 1);
      await updateCartBadge();
      showToast(`${design.name} ${v.label} added to cart`);
    } catch (err) {
      showToast('Could not add to cart — please try again');
      console.error(err);
    } finally {
      addBtn.disabled = false;
    }
  });
  centerWrap.appendChild(addBtn);

  const gridBtn = document.createElement('a');
  gridBtn.className = 'exhibit-nav-grid';
  gridBtn.href = 'origami.html';
  gridBtn.setAttribute('aria-label', 'View all');
  gridBtn.innerHTML = `<svg viewBox="0 0 16 16" fill="none" width="15" height="15"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1" fill="#797842"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1" fill="#797842"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1" fill="#797842"/><rect x="9" y="9" width="5.5" height="5.5" rx="1" fill="#797842"/></svg><span class="exhibit-nav-tooltip">View all</span>`;
  centerWrap.appendChild(gridBtn);

  nav.appendChild(centerWrap);

  const nextSide = document.createElement('a');
  nextSide.className = 'exhibit-nav-side next';
  if (design.nextPiece) {
    nextSide.href = design.nextPiece.file;
    nextSide.innerHTML = `<div class="exhibit-nav-label-row"><span class="exhibit-nav-name">${design.nextPiece.name}</span>${nextChevron}</div><span class="exhibit-nav-count">${PIECE_INDEX + 1} / ${PIECES.length}</span>`;
  } else {
    nextSide.href = 'index.html';
    nextSide.innerHTML = `<div class="exhibit-nav-label-row"><span class="exhibit-nav-name">Origami</span>${nextChevron}</div><span class="exhibit-nav-count">Back to collection</span>`;
  }
  nav.appendChild(nextSide);
}
buildExhibitNav();

   not tabbed; see nava-styles.css .thinking-provenance-stack) ── */

    document.getElementById(bodyId).classList.toggle('open', open);

document.getElementById('skinRow').querySelectorAll('.stile').forEach(t => {

function flyToCart(originEl, qty) {
  const cartIconEl = document.getElementById('cartIconLink');
  const cartBadgeEl = document.getElementById('cartBadge');
  if (!originEl || !cartIconEl) return;

  const originRect = originEl.getBoundingClientRect();
  const targetRect = cartIconEl.getBoundingClientRect();
  const originX = originRect.left + originRect.width / 2;
  const originY = originRect.top + originRect.height / 2;
  const targetX = targetRect.left + targetRect.width / 2;
  const targetY = targetRect.top + targetRect.height / 2;

  const badge = document.createElement('div');
  badge.className = 'fly-badge';
  badge.textContent = `+${qty}`;
  badge.style.left = `${originX}px`;
  badge.style.top = `${originY}px`;
  badge.style.transform = 'translate(-50%, -50%) scale(1)';
  document.body.appendChild(badge);

  // Force layout so the browser registers the start position/transform
  // before the next one is applied — otherwise the flight jumps straight
  // to the end with no visible motion.
  void badge.offsetWidth;

  requestAnimationFrame(() => {
    const dx = targetX - originX;
    const dy = targetY - originY;
    badge.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.6)`;
    badge.classList.add('fly-land');
  });

  badge.addEventListener('transitionend', () => {
    badge.remove();
    if (cartBadgeEl) {
      cartBadgeEl.classList.remove('bump');
      void cartBadgeEl.offsetWidth;
      cartBadgeEl.classList.add('bump');
    }
  }, { once: true });
}

/* ── QUANTITY ── */
let currentQty = 1;
const qtyValueEl = document.getElementById('qtyValue');
document.getElementById('qtyMinus').addEventListener('click', () => {
  if (currentQty > 1) { currentQty--; qtyValueEl.textContent = currentQty; }
});
document.getElementById('qtyPlus').addEventListener('click', () => {
  currentQty++; qtyValueEl.textContent = currentQty;
});

/* ── ADD TO CART — always reads the currently active variant, no backend ── */
document.getElementById('ctaBtn').addEventListener('click', async () => {
  const btn = document.getElementById('ctaBtn');
  const v = variants[activeKey];
  btn.disabled = true;
  btn.textContent = 'Adding...';
  const qtyAtClick = currentQty;
  try {
    await addToCart(resolveVariantGid(v), qtyAtClick);
    flyToCart(document.getElementById('qtyValue'), qtyAtClick);
    await updateCartBadge();
    showToast(`${design.name} ${v.label} added to cart`);
    currentQty = 1;
    qtyValueEl.textContent = currentQty;
  } catch (err) {
    showToast('Could not add to cart — please try again');
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add to cart';
  }
});

/* ── PRICE BREAKDOWN — "i" button next to the price ── */
document.querySelectorAll('.price-info-btn').forEach(btn => {
  btn.addEventListener('click', (e) => showPriceBreakdown(variants[activeKey], e.currentTarget));
});

const heroWhatsappBox = document.getElementById('heroWhatsappBox');
if (heroWhatsappBox) {
  heroWhatsappBox.addEventListener('click', function () {
    showWaPopover(heroWhatsappBox);
  });
}

/* ── INITIAL RENDER ── earring is the default open variant ── */
renderVariant(activeKey);
</script>
