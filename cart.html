<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="nava-styles.css">
<script src="nava-cart.js"></script>
<style>
  .cart-wrap {
    padding: 100px 24px 140px;
    min-height: 100vh;
  }
  .cart-title {
    font-family: 'Josefin Sans', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 22px;
    color: #F0EDE4;
    margin-bottom: 24px;
  }
  .cart-empty {
    font-family: 'DM Sans', 'Helvetica Neue', sans-serif;
    color: rgba(240,237,228,0.6);
    font-size: 14px;
    text-align: center;
    margin-top: 60px;
  }
  .cart-empty a {
    color: #F0EDE4;
    text-decoration: underline;
  }
  .cart-line {
    display: flex;
    gap: 14px;
    padding: 18px 0;
    border-bottom: 1px solid rgba(240,237,228,0.12);
  }
  .cart-line-img {
    width: 76px;
    height: 96px;
    object-fit: cover;
    border-radius: 4px;
    background: rgba(240,237,228,0.06);
    flex-shrink: 0;
  }
  .cart-line-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .cart-line-name {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: #F0EDE4;
  }
  .cart-line-price {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 13px;
    color: rgba(240,237,228,0.75);
    margin-top: 4px;
  }
  .cart-line-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
  }
  .cart-qty-stepper {
    display: flex;
    align-items: center;
    border: 1px solid rgba(240,237,228,0.3);
    border-radius: 999px;
    overflow: hidden;
  }
  .cart-qty-btn {
    background: none;
    border: none;
    color: #F0EDE4;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    width: 30px;
    height: 30px;
    cursor: pointer;
    line-height: 1;
  }
  .cart-qty-btn:hover { background: rgba(240,237,228,0.08); }
  .cart-qty-value {
    min-width: 24px;
    text-align: center;
    color: #F0EDE4;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
  }
  .cart-remove-btn {
    background: none;
    border: none;
    color: rgba(240,237,228,0.5);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .cart-summary {
    margin-top: 28px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 16px;
    border-top: 1px solid rgba(240,237,228,0.2);
  }
  .cart-summary-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(240,237,228,0.6);
  }
  .cart-summary-total {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 22px;
    color: #F0EDE4;
  }
  .cart-checkout-btn {
    width: 100%;
    margin-top: 24px;
    padding: 16px;
    background: transparent;
    border: 1px solid #F0EDE4;
    color: #F0EDE4;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-align: center;
    cursor: pointer;
    border-radius: 2px;
  }
  .cart-checkout-btn:hover { background: rgba(240,237,228,0.08); }
  .cart-checkout-btn:disabled { opacity: 0.5; cursor: default; }
  .cart-continue-link {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 16px;
    background: transparent;
    border: 1px solid rgba(240,237,228,0.5);
    color: #F0EDE4;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-align: center;
    text-decoration: none;
    border-radius: 2px;
    box-sizing: border-box;
  }
  .cart-continue-link:hover { background: rgba(240,237,228,0.08); }
  .cart-loading {
    text-align: center;
    color: rgba(240,237,228,0.5);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    margin-top: 60px;
  }
</style>

<script>
/* ── DEVICE ROUTER — identical mechanism to suri.html and every other
   product/utility page. Decides once, synchronously, before cart data
   renders. ── */
(function () {
  var isDesktop = window.matchMedia(
    '(min-width: 1024px) and (hover: hover) and (pointer: fine)'
  ).matches;
  document.documentElement.classList.toggle('nava-desktop', isDesktop);
  var tpl = document.getElementById(isDesktop ? 'tpl-desktop' : 'tpl-mobile');
  document.body.appendChild(tpl.content.cloneNode(true));
})();
</script>

<script>
/* ── MOBILE HAMBURGER MENU — only wires up if the mobile template was
   cloned in; identical to suri.html's version. ── */
(function initMobileMenu() {
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  if (!hamburgerBtn) return;

  const closeMenuBtn = document.getElementById('closeMenuBtn');
  const menuOverlay = document.getElementById('mobileMenuOverlay');
  const cartIconLink = document.getElementById('cartIconLink');
  const collectionsToggle = document.getElementById('collectionsToggle');
  const collectionsSubList = document.getElementById('collectionsSubList');
  const faqMenuToggle = document.getElementById('faqMenuToggle');
  const faqMenuSubList = document.getElementById('faqMenuSubList');

  hamburgerBtn.addEventListener('click', () => {
    menuOverlay.classList.add('open');
    cartIconLink.style.display = 'none';
  });
  closeMenuBtn.addEventListener('click', () => {
    menuOverlay.classList.remove('open');
    cartIconLink.style.display = '';
  });
  collectionsToggle.addEventListener('click', () => {
    collectionsSubList.classList.toggle('open');
  });
  faqMenuToggle.addEventListener('click', () => {
    faqMenuSubList.classList.toggle('open');
  });
})();
</script>

<script>
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 10);
}, { passive: true });
// Desktop's shell scrolls internally (window itself doesn't scroll),
// so mirror the same 'scrolled' toggle onto the desktop content area.
const cartDesktopMain = document.querySelector('.cart-desktop-main');
if (cartDesktopMain) {
  cartDesktopMain.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', cartDesktopMain.scrollTop > 10);
  }, { passive: true });
}

function formatPrice(amount, currencyCode) {
  const num = parseFloat(amount);
  if (currencyCode === 'INR') {
    return `₹ ${num.toLocaleString('en-IN', { maximumFractionDigits: 0 })}`;
  }
  return `${currencyCode} ${num.toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
}

async function renderCart() {
  const isDesktop = document.documentElement.classList.contains('nava-desktop');
  const contentEl = document.getElementById('cartContent');
  const titleEl = document.querySelector(isDesktop ? '.cart-desktop-title' : '.cart-title');
  const cart = await getCart();

  if (!cart || cart.lines.edges.length === 0) {
    if (titleEl) titleEl.style.display = 'none';

    if (isDesktop) {
      contentEl.innerHTML = `
        <div class="cart-desktop-empty">
          <img src="nava-origami-flower.png" alt="Origami collection">
          <div class="cde-eyebrow">CART</div>
          <div class="cde-title">Origami</div>
          <p class="cde-copy">Your cart is empty. Tap "begin" to explore.</p>
          <a href="suri-hanging-earrings.html" class="cde-begin"><span>BEGIN</span></a>
        </div>
      `;
    } else {
      contentEl.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px 20px;">
          <img src="nava-origami-flower.png" alt="Origami collection" style="width:300px;height:auto;margin-bottom:2px;">
          <div style="text-align:center;margin-bottom:16px;">
            <div style="color:rgba(240,237,228,0.45);font-size:9px;letter-spacing:3px;margin-bottom:12px;font-family:'Josefin Sans', sans-serif;">CART</div>
            <div style="font-family:'EB Garamond', Georgia, serif;font-style:italic;color:#F0EDE4;font-size:36px;line-height:1;letter-spacing:-0.5px;">Origami</div>
          </div>
          <p style="color:rgba(240,237,228,0.6);font-size:13px;line-height:1.8;text-align:center;max-width:280px;margin:0 0 44px;">
            Your cart is empty. Tap "begin" to explore.
          </p>
          <a href="suri-hanging-earrings.html" style="display:block;width:100%;max-width:280px;border:1px solid rgba(240,237,228,0.5);border-radius:2px;padding:16px;text-align:center;text-decoration:none;">
            <span style="color:#F0EDE4;font-size:9px;letter-spacing:3px;font-family:'Josefin Sans', sans-serif;">BEGIN</span>
          </a>
        </div>
      `;
    }
    return;
  }

  if (titleEl) titleEl.style.display = 'block';

  if (isDesktop) {
    let html = `
      <div class="cart-desktop-header-row">
        <span></span><span>Piece</span><span>Quantity</span><span style="text-align:right;">Total</span><span></span>
      </div>
    `;
    cart.lines.edges.forEach(({ node: line }) => {
      const variant = line.merchandise;
      const imgUrl = variant.image ? variant.image.url : '';
      const lineTotal = (parseFloat(variant.price.amount) * line.quantity).toFixed(2);
      html += `
        <div class="cart-line-desktop" data-line-id="${line.id}">
          ${imgUrl ? `<img class="cart-line-desktop-img" src="${imgUrl}" alt="${variant.product.title}">` : '<div class="cart-line-desktop-img"></div>'}
          <div>
            <div class="cart-line-desktop-name">${variant.product.title}</div>
            <div class="cart-line-desktop-price">${formatPrice(variant.price.amount, variant.price.currencyCode)}</div>
          </div>
          <div class="cart-qty-stepper">
            <button class="cart-qty-btn" data-action="minus" data-line-id="${line.id}" data-qty="${line.quantity}" type="button">−</button>
            <span class="cart-qty-value">${line.quantity}</span>
            <button class="cart-qty-btn" data-action="plus" data-line-id="${line.id}" data-qty="${line.quantity}" type="button">+</button>
          </div>
          <div class="cart-line-desktop-total">${formatPrice(lineTotal, variant.price.currencyCode)}</div>
          <button class="cart-remove-btn" data-line-id="${line.id}" type="button">Remove</button>
        </div>
      `;
    });

    html += `
      <div class="cart-desktop-summary">
        <span class="cart-desktop-summary-label">Total</span>
        <span class="cart-desktop-summary-total">${formatPrice(cart.cost.totalAmount.amount, cart.cost.totalAmount.currencyCode)}</span>
      </div>
      <div class="cart-desktop-actions">
        <a class="cart-desktop-continue-link" id="continueLink" href="${localStorage.getItem('nava_last_piece') || 'suri-hanging-earrings.html'}">Continue browsing</a>
        <button class="cart-desktop-checkout-btn" id="checkoutBtn" type="button">Checkout</button>
      </div>
    `;
    contentEl.innerHTML = html;

  } else {
    let html = '';
    cart.lines.edges.forEach(({ node: line }) => {
      const variant = line.merchandise;
      const imgUrl = variant.image ? variant.image.url : '';
      const lineTotal = (parseFloat(variant.price.amount) * line.quantity).toFixed(2);
      html += `
        <div class="cart-line" data-line-id="${line.id}">
          ${imgUrl ? `<img class="cart-line-img" src="${imgUrl}" alt="${variant.product.title}">` : '<div class="cart-line-img"></div>'}
          <div class="cart-line-info">
            <div>
              <div class="cart-line-name">${variant.product.title}</div>
              <div class="cart-line-price">${formatPrice(lineTotal, variant.price.currencyCode)}</div>
            </div>
            <div class="cart-line-controls">
              <div class="cart-qty-stepper">
                <button class="cart-qty-btn" data-action="minus" data-line-id="${line.id}" data-qty="${line.quantity}" type="button">−</button>
                <span class="cart-qty-value">${line.quantity}</span>
                <button class="cart-qty-btn" data-action="plus" data-line-id="${line.id}" data-qty="${line.quantity}" type="button">+</button>
              </div>
              <button class="cart-remove-btn" data-line-id="${line.id}" type="button">Remove</button>
            </div>
          </div>
        </div>
      `;
    });

    html += `
      <div class="cart-summary">
        <span class="cart-summary-label">Total</span>
        <span class="cart-summary-total">${formatPrice(cart.cost.totalAmount.amount, cart.cost.totalAmount.currencyCode)}</span>
      </div>
      <button class="cart-checkout-btn" id="checkoutBtn" type="button">Checkout</button>
      <a class="cart-continue-link" id="continueLink" href="${localStorage.getItem('nava_last_piece') || 'suri-hanging-earrings.html'}">Continue browsing</a>
    `;
    contentEl.innerHTML = html;
  }

  contentEl.querySelectorAll('.cart-qty-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const lineId = btn.dataset.lineId;
      let qty = parseInt(btn.dataset.qty, 10);
      qty = btn.dataset.action === 'plus' ? qty + 1 : qty - 1;
      if (qty < 1) {
        await removeLine(lineId);
      } else {
        await updateLineQty(lineId, qty);
      }
      await updateCartBadge();
      await renderCart();
    });
  });

  contentEl.querySelectorAll('.cart-remove-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      await removeLine(btn.dataset.lineId);
      await updateCartBadge();
      await renderCart();
    });
  });

  document.getElementById('checkoutBtn').addEventListener('click', async () => {
    const checkoutBtn = document.getElementById('checkoutBtn');
    checkoutBtn.disabled = true;
    checkoutBtn.textContent = 'Redirecting...';
    const url = await getCheckoutUrl();
    if (url) {
      window.location.href = url;
    } else {
      checkoutBtn.disabled = false;
      checkoutBtn.textContent = 'Checkout';
      showToast('Could not start checkout — please try again');
    }
  });
}

renderCart();
updateCartBadge();
</script>

</body>
