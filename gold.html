        <div class="g-title">9 Carat Gold,<br>Explained</div>
        <p class="g-sub">The alloy, the regulation, the economics — stated plainly, not sold.</p>
      </div>

      <div class="g-scroll-wrap">

        <!-- 01 — THE ALLOY -->
        <div class="g-section layout-a">
          <div class="g-graphic">
            <svg viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="70" cy="70" r="54" stroke="rgba(240,237,228,0.15)" stroke-width="9"/>
              <circle cx="70" cy="70" r="54" stroke="#797842" stroke-width="9" stroke-linecap="round"
                stroke-dasharray="127.2 212.1" transform="rotate(-90 70 70)"/>
              <text x="70" y="66" text-anchor="middle" font-family="Josefin Sans, sans-serif" font-weight="600" font-size="17" letter-spacing="1" fill="#F0EDE4">9K</text>
              <text x="70" y="84" text-anchor="middle" font-family="Josefin Sans, sans-serif" font-size="9" letter-spacing="2" fill="rgba(240,237,228,0.5)">37.5% GOLD</text>
            </svg>
          </div>
          <div class="g-index">01</div>
          <div class="g-label">An Alloy</div>
          <div class="g-pullline">Just like 14k, 18k, 22k or 24k</div>
          <p class="g-body">Every jewellery-grade purity — 24K, 22K, 18K, 14K, 9K — is gold alloyed with other metals for strength and colour. 18 carat, often sold as premium, is 75% gold. 9 carat is 37.5% gold. Both are alloys.</p>
        </div>

        <!-- 02 — HALLMARKED -->
        <div class="g-section layout-b">
          <div class="g-graphic">
            <svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="80" cy="80" r="62" stroke="#797842" stroke-width="1.4"/>
              <circle cx="80" cy="80" r="50" stroke="rgba(240,237,228,0.25)" stroke-width="0.8" stroke-dasharray="2,3"/>
              <text x="80" y="72" text-anchor="middle" font-family="Josefin Sans, sans-serif" font-weight="600" font-size="19" letter-spacing="1" fill="#F0EDE4">9K</text>
              <text x="80" y="91" text-anchor="middle" font-family="Josefin Sans, sans-serif" font-size="10" letter-spacing="2" fill="#797842">375 FINE</text>
              <text x="80" y="108" text-anchor="middle" font-family="Josefin Sans, sans-serif" font-size="8" letter-spacing="2.5" fill="rgba(240,237,228,0.45)">BIS HALLMARKED</text>
            </svg>
          </div>
          <div class="g-index">02</div>
          <div class="g-label">Hallmarked</div>
          <div class="g-pullline">Certified like any other purity.</div>
          <p class="g-body">Since July 2025, the Bureau of Indian Standards has hallmarked 9K gold under the same scheme covering 14K through 24K — a 375 fineness mark, a traceable HUID, the same BIS Act, 2016.</p>
        </div>

        <!-- 03 — THE ECONOMICS -->
        <div class="g-section layout-c">
          <div class="g-graphic">
            <svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="45" cy="30" rx="38" ry="15" stroke="#797842" stroke-width="3"/>
              <line x1="45" y1="45" x2="45" y2="58" stroke="rgba(240,237,228,0.35)" stroke-width="1"/>
              <rect x="18" y="58" width="54" height="24" rx="3" fill="none" stroke="rgba(240,237,228,0.35)" stroke-width="1"/>
              <text x="45" y="74" text-anchor="middle" font-family="Josefin Sans, sans-serif" font-size="11" letter-spacing="1" fill="#F0EDE4">3.75g</text>
            </svg>
          </div>
          <div class="g-index">03</div>
          <div class="g-label">The Economics</div>
          <div class="g-pullline">9k retains its investment value</div>
          <p class="g-body">9K is valued by the actual weight of gold it contains, tracked against the same market rate as any purity. A 10‑gram piece holds 3.75 grams of hallmarked gold — not a synthetic stand-in. Not a claim about returns; a fact about the metal.</p>
        </div>

        <!-- 04 — SOLID, NOT PLATED -->
        <div class="g-section layout-d">
          <div class="g-graphic">
            <svg viewBox="0 0 260 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="65" cy="55" rx="46" ry="18" fill="#797842"/>
              <text x="65" y="100" text-anchor="middle" font-family="Josefin Sans, sans-serif" font-size="9.5" letter-spacing="1.5" fill="rgba(240,237,228,0.6)">SOLID</text>
              <ellipse cx="195" cy="55" rx="46" ry="18" fill="none" stroke="#797842" stroke-width="8"/>
              <ellipse cx="195" cy="55" rx="24" ry="7" fill="#36192B"/>
              <text x="195" y="100" text-anchor="middle" font-family="Josefin Sans, sans-serif" font-size="9.5" letter-spacing="1.5" fill="rgba(240,237,228,0.6)">PLATED</text>
            </svg>
          </div>
          <div class="g-index">04</div>
          <div class="g-label">Solid, Not Plated</div>
          <div class="g-pullline">Nothing here to wear through.</div>
          <p class="g-body">Vermeil is silver with a gold layer over it. Demi-fine is looser still — brass, plated to no fixed standard. 9 carat gold is solid alloy from surface to core.</p>
        </div>
