        <h1 class="gg-title">Hallmarking &amp; Certification</h1>
        <p class="gg-intro">Every Nava piece is made in real gold and real silver, and every claim we make about that material is independently verifiable. This page explains what hallmarking means, how Nava pieces are certified, and how you can check it yourself.</p>

        <h2 class="gg-h2">What Is Hallmarking?</h2>
        <p class="gg-p">Hallmarking is an independent, government-regulated system for certifying the purity of precious metal jewellery. In India, it is administered by the Bureau of Indian Standards (BIS), the national standards body, under the BIS (Hallmarking) Regulations, 2018.</p>
        <p class="gg-p">A hallmark is not a maker's mark or a decorative stamp — it is a third-party guarantee. A piece is tested at a BIS-recognised Assaying and Hallmarking Centre before it can carry one, so the purity stated on the piece has been verified independently of the jeweller who made it.</p>

        <h2 class="gg-h2">Are Nava Pieces Hallmarked?</h2>
        <p class="gg-p">Yes. Every Nava piece carries certification appropriate to its metal.</p>
        <h3 class="gg-h3">Gold</h3>
        <p class="gg-p">Nava's gold pieces are BIS hallmarked. Each piece is assigned a unique Hallmark Unique Identification number — a HUID — a six-character alphanumeric code generated at the time of hallmarking and tied to that individual piece in BIS's own records. 9kt gold hallmarking is presently a voluntary grade under the BIS Standard rather than one of the mandatory caratages; Nava hallmarks its 9kt pieces regardless, because verifiable purity is not something we consider optional.</p>
        <h3 class="gg-h3">Silver</h3>
        <p class="gg-p">Nava's silver components are marked 925 — sterling silver, the globally recognised standard for 92.5% pure silver alloyed for strength. Silver hallmarking remains voluntary nationwide in India; the 925 fineness mark is the industry-standard purity indicator we apply to every silver element.</p>

        <h2 class="gg-h2">How Is This Visible On Your Piece?</h2>
        <p class="gg-p">Certification is physically present on the piece itself, not just claimed in writing.</p>
        <ul class="gg-list">
          <li>Gold components carry a stamped or laser-engraved HUID, alongside the purity mark (9K375).</li>
          <li>Silver components carry a stamped 925 fineness mark.</li>
          <li>On fine, delicate forms, these marks are necessarily small — proportionate to the piece — but they are present on every qualifying component, not applied selectively.</li>
        </ul>
        <p class="gg-p">The HUID is also printed on the invoice that accompanies every order, so you have a written record of the exact code stamped on your piece, independent of the physical mark itself.</p>

        <h2 class="gg-h2">How Can This Be Verified?</h2>
        <p class="gg-p">The HUID on your invoice can be independently verified through BIS directly — Nava is not part of this verification step, which is the point of a third-party system.</p>
        <ul class="gg-list">
          <li>Download the BIS Care app (Android and iOS) or visit the BIS CARE portal.</li>
          <li>Select "Verify HUID" and enter the six-character code from your invoice or piece.</li>
          <li>BIS returns the registered jeweller, the hallmarking centre, and the certified purity for that exact piece.</li>
        </ul>
        <p class="gg-p">Because 925 sterling is an industry fineness standard rather than a BIS-issued identifier, it does not carry an individual traceable code the way the gold HUID does — but the mark itself follows the same 92.5% purity definition used across the industry, and is applied consistently to every silver component we use.</p>

        <div class="gg-final">
          <h2 class="gg-h2">Our Position</h2>
          <p class="gg-p">Nava's design thesis is that a piece is worth choosing for its form, not its carat weight. That conviction only holds up if the material claims underneath it are honest and checkable. Hallmarking gold and marking silver to standard is how we keep that promise — not as a marketing signal, but as a matter of course.</p>
        </div>
