  /* ═══════════════════════════════════════════════════════════
     PAGE-FILL FIX — applies to BOTH mobile and desktop templates.
     Root cause of the "footer floating with a gap below it" bug:
     the mobile wrapper div never had an explicit height, so its
     flex:1 child (.col-viewport) had nothing real to grow into,
     and <footer> — a separate sibling, outside that div — just
     trailed wherever content happened to end. Fix: one shared
     100dvh flex column (#pageShell) holding [content-flex:1,
     footer-flex:0-0-auto] for both templates, so footer is always
     flush to the true bottom and the middle content can actually
     center within whatever space remains above it.
     ═══════════════════════════════════════════════════════════ */
  html, body { margin:0; }
  #pageShell {
    display:flex;
    flex-direction:column;
    min-height:100dvh;
    min-height:100vh; /* fallback for browsers without dvh support */
  }
  #pageShell > footer { flex:0 0 auto; }

  /* ── MOBILE content area — pinned to fill exactly one viewport's
     height on its own (min-height, not flex:1 against a shrinking
     shell), so it stays visually unchanged no matter how tall the
     footer below it grows. Footer flows as a normal sibling after
     it, extending total page height past one screen. ── */
  .mobile-content {
    flex:0 0 auto;
    min-height:100dvh;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    max-width:430px;
    margin:0 auto;
    width:100%;
    font-family:sans-serif;
  }
  .mobile-content .col-viewport { flex:1; min-height:0; overflow:hidden; }

   template's own script runs. Same pattern as suri.html. ── */
(function () {
  var isDesktop = window.matchMedia(
    '(min-width: 1024px) and (hover: hover) and (pointer: fine)'
  ).matches;
  document.documentElement.classList.toggle('nava-desktop', isDesktop);
  var tpl = document.getElementById(isDesktop ? 'tpl-desktop' : 'tpl-mobile');
  document.body.appendChild(tpl.content.cloneNode(true));
})();
</script>

<script>
/* ── DESKTOP HERO VIDEO — crossfade loop, only wires up if the
   desktop template was cloned in (element simply won't exist on
   mobile). Mirrors the tpl-desktop/tpl-mobile guard pattern used
   by initMobile() below. ── */
(function initHeroVideo() {
  var wrap = document.querySelector('.desktop-hero-video-wrap');
  if (!wrap) return;

  var vidA = wrap.querySelector('.desktop-hero-video-a');
  var vidB = wrap.querySelector('.desktop-hero-video-b');
  var RATE = 0.6;              /* 5x slower than native speed */
  var FADE_REAL_SECONDS = 1;   /* wall-clock length of the crossfade */

  var active = vidA;
  var standby = vidB;
  var crossfading = false;

  [vidA, vidB].forEach(function (v) {
    v.muted = true;
    v.playbackRate = RATE;
    v.currentTime = 0;
  });

  var startPromise = vidA.play();
  if (startPromise && startPromise.catch) startPromise.catch(function () {});

  function handleTimeUpdate() {
    if (crossfading) return;
    if (!active.duration || isNaN(active.duration)) return;

    var mediaThreshold = FADE_REAL_SECONDS * RATE;
    if (active.duration - active.currentTime <= mediaThreshold) {
      crossfading = true;

      standby.currentTime = 0;
      standby.playbackRate = RATE;
      var playPromise = standby.play();
      if (playPromise && playPromise.catch) playPromise.catch(function () {});

      standby.classList.add('is-visible');
      active.classList.remove('is-visible');

      window.setTimeout(function () {
        active.pause();
        var finishedActive = active;
        active = standby;
        standby = finishedActive;
        crossfading = false;
      }, FADE_REAL_SECONDS * 1000 + 50);
    }
  }

  vidA.addEventListener('timeupdate', handleTimeUpdate);
  vidB.addEventListener('timeupdate', handleTimeUpdate);
})();
</script>

<script>
/* ── MOBILE CAROUSEL — only wires up if the mobile template was
   cloned in (elements will simply not exist otherwise). ── */
(function initMobile() {
  const track = document.getElementById('colTrack');
  if (!track) return;

  const viewport = document.getElementById('colViewport');
  const prevChev = document.getElementById('colPrev');
  const nextChev = document.getElementById('colNext');
  const slideCount = 2;
  let active = 0;
  let autoTimer = null;

  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const closeMenuBtn = document.getElementById('closeMenuBtn');
  const menuOverlay = document.getElementById('mobileMenuOverlay');
  const collectionsToggle = document.getElementById('collectionsToggle');
  const collectionsSubList = document.getElementById('collectionsSubList');
  const faqMenuToggle = document.getElementById('faqMenuToggle');
  const faqMenuSubList = document.getElementById('faqMenuSubList');

  hamburgerBtn.addEventListener('click', () => {
    menuOverlay.classList.add('open');
  });
  closeMenuBtn.addEventListener('click', () => {
    menuOverlay.classList.remove('open');
  });
  collectionsToggle.addEventListener('click', () => {
    collectionsSubList.classList.toggle('open');
  });
  faqMenuToggle.addEventListener('click', () => {
    faqMenuSubList.classList.toggle('open');
  });

  function render() {
    track.style.transform = `translateX(-${active * (100 / slideCount)}%)`;
    document.querySelectorAll('.col-dot').forEach(d => {
      d.classList.toggle('on', parseInt(d.dataset.i, 10) === active);
    });
    prevChev.classList.toggle('disabled', active === 0);
    nextChev.classList.toggle('disabled', active === slideCount - 1);
  }

  function goTo(i) {
    active = Math.max(0, Math.min(slideCount - 1, i));
    render();
    restartAuto();
  }

  function startAuto() {
    autoTimer = setInterval(() => {
      active = (active + 1) % slideCount;
      render();
    }, 5000);
  }
  function restartAuto() {
    clearInterval(autoTimer);
    startAuto();
  }

  render();
  startAuto();

  prevChev.addEventListener('click', () => goTo(active - 1));
  nextChev.addEventListener('click', () => goTo(active + 1));
  document.querySelectorAll('.col-dot').forEach(d => {
    d.addEventListener('click', () => goTo(parseInt(d.dataset.i, 10)));
  });

  /* SWIPE / DRAG */
  let startX = 0, dragDx = 0, isDragging = false;
  function dragStart(x) { startX = x; dragDx = 0; isDragging = true; track.style.transition = 'none'; }
  function dragMove(x) {
    if (!isDragging) return;
    dragDx = x - startX;
    const base = -active * (100 / slideCount);
    const dxPct = (dragDx / viewport.offsetWidth) * 100;
    track.style.transform = `translateX(${base + dxPct}%)`;
  }
  function dragEnd() {
    if (!isDragging) return;
    isDragging = false;
    track.style.transition = 'transform 0.6s ease';
    if (dragDx < -44) goTo(active + 1);
    else if (dragDx > 44) goTo(active - 1);
    else render();
  }
  viewport.addEventListener('touchstart', e => dragStart(e.touches[0].clientX), { passive: true });
  viewport.addEventListener('touchmove',  e => dragMove(e.touches[0].clientX),  { passive: true });
  viewport.addEventListener('touchend',   dragEnd, { passive: true });
  viewport.addEventListener('mousedown',  e => dragStart(e.clientX));
  viewport.addEventListener('mousemove',  e => dragMove(e.clientX));
  viewport.addEventListener('mouseup',    dragEnd);
  viewport.addEventListener('mouseleave', dragEnd);
})();

function initCollectionRows() {
  const anyRow = document.querySelector('.collection-row');
  if (!anyRow) return;

  document.querySelectorAll('.collection-row-chevron').forEach(chevron => {
    chevron.addEventListener('click', () => {
      window.location.href = chevron.dataset.page;
    });
  });

  document.querySelectorAll('.collection-row').forEach(row => {
    row.addEventListener('click', (e) => {
      const variantBox = e.target.closest('.collection-row-variant-box');
      if (variantBox) {
        e.stopPropagation();
        const card = variantBox.closest('.collection-row-card');
        card.style.backgroundImage = `url('${variantBox.dataset.image}')`;
        card.querySelectorAll('.collection-row-variant-box').forEach(b => b.classList.remove('active'));
        variantBox.classList.add('active');
        return;
      }
      const card = e.target.closest('.collection-row-card');
      if (card && card.dataset.page) {
        card.classList.add('collection-row-navigating');
        const flagKey = row.dataset.flag;
        if (flagKey) sessionStorage.setItem(flagKey, '1');
        setTimeout(() => { window.location.href = card.dataset.page; }, 350);
      }
    });
  });

  window.addEventListener('pageshow', (event) => {
    if (event.persisted) {
      document.querySelectorAll('.collection-row-card.collection-row-navigating')
        .forEach(card => card.classList.remove('collection-row-navigating'));
    }
  });

  initCollectionRowScrollButtons();
}

function initCollectionRowScrollButtons() {
  document.querySelectorAll('.collection-row-wrap').forEach(wrap => {
    const row = wrap.querySelector('.collection-row');
    const prevBtn = wrap.querySelector('.collection-row-scroll-btn.prev');
    const nextBtn = wrap.querySelector('.collection-row-scroll-btn.next');
    if (!row || !prevBtn || !nextBtn) return; // mobile template: none of this exists

    function updateButtons() {
      const maxScroll = row.scrollWidth - row.clientWidth;
      prevBtn.classList.toggle('visible', row.scrollLeft > 4);
      nextBtn.classList.toggle('visible', row.scrollLeft < maxScroll - 4);
    }

    function scrollByOneCard(direction) {
      const card = row.querySelector('.collection-row-card');
      if (!card) return;
      const cardWidth = card.getBoundingClientRect().width;
      const gap = parseFloat(getComputedStyle(row).columnGap || getComputedStyle(row).gap || '12');
      row.scrollBy({ left: direction * (cardWidth + gap), behavior: 'smooth' });
    }

    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); scrollByOneCard(-1); });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); scrollByOneCard(1); });
    row.addEventListener('scroll', updateButtons);
    window.addEventListener('resize', updateButtons);
    updateButtons();
  });
}

initCollectionRows();
</script>
